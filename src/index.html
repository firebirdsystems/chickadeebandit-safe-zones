<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe Zones</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <script src="./vendor/leaflet/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --red: var(--hub-tint-danger-fg, #b91c1c); --red-soft: var(--hub-tint-danger, #fee2e2);
      --amber: var(--hub-tint-warning-fg, #b45309); --amber-soft: var(--hub-tint-warning, #fef3c7);
      --green: var(--hub-tint-success-fg, #16a34a); --green-soft: var(--hub-tint-success, #dcfce7);
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      border: 1.5px solid var(--border-mid); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
    }
    .tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .banner { padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .84rem; }
    .banner.warn { background: var(--amber-soft); color: var(--amber); }
    .banner.bad { background: var(--red-soft); color: var(--red); }
    .banner.ok { background: var(--green-soft); color: var(--green); }
    #map { height: 300px; border-radius: 8px; margin-bottom: 10px; }
    .field { display: grid; gap: 4px; margin-bottom: 10px; }
    label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input[type="text"] {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="range"] { width: 100%; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .check {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      border: 1.5px solid var(--border-mid); border-radius: 999px; padding: 5px 11px;
      font-size: .83rem; font-weight: 700; background: var(--surface); user-select: none;
    }
    .check input { accent-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 9px 14px;
      font: inherit; font-size: .88rem; font-weight: 700; cursor: pointer;
      min-height: 40px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn.ghost { background: transparent; border-color: var(--border-mid); color: var(--text); }
    .btn.danger { background: var(--red); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .zone-list { display: grid; gap: 10px; }
    .zone-tile { display: flex; align-items: center; gap: 12px; }
    .zone-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); flex: 0 0 auto; }
    .zone-dot.off { background: var(--border-mid); }
    .zone-main { flex: 1 1 auto; min-width: 0; }
    .zone-name { font-weight: 700; }
    .zone-sub { color: var(--muted); font-size: .8rem; }
    .zone-presence { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .pchip { font-size: .75rem; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
    .hist { display: grid; gap: 8px; }
    .hist-row { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; }
    .hist-when { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .empty, .loading { color: var(--muted); text-align: center; padding: 28px 16px; }
    .empty h2 { color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .search-row { display: flex; gap: 8px; }
    .search-row input[type="text"] { flex: 1 1 auto; min-width: 0; }
    .search-row .btn { flex: 0 0 auto; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .results { display: grid; gap: 4px; margin: 8px 0 0; }
    .result {
      text-align: left; border: 1.5px solid var(--border-mid); background: var(--surface);
      color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit;
      font-size: .84rem; cursor: pointer;
    }
    .result:hover { border-color: var(--accent); }
    .search-note { margin-top: 6px; }
  </style>
  <base href="/run/safe-zones/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import { esc, isAdult, hubConfirm, hubAlert, formatRelativeDate, glyph } from "/hub-sdk.js";
import {
  MIN_RADIUS_M, MAX_RADIUS_M, MAX_ZONES,
  clampRadius, validateZone, parseZoneRow, trackerStatusLine, trackerIsStale, trackerBatteryLabel,
  presenceSummary,
  buildGeocodeUrl, parseGeocodeResults, zoneNameFromResult,
  ownActivityNote,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const APP_ID = window.__APP_ID ?? "safe-zones";
// App-origin runtime path. The hub-origin /api/geofence/zones/manage twin is
// for the hub's own screens — only /run/{appId}/... exists on this origin.
const ZONE_MANAGE = `/run/${APP_ID}/api/geofence/zones/manage`;
const ME = window.__CURRENT_MEMBER ?? null;
const TENANT = { tenantKind: window.__TENANT_KIND ?? "household", spaceKind: window.__SPACE_KIND ?? null, isAdmin: window.__IS_ADMIN === true };

let members = [];
let trackers = [];
let presence = [];   // hub-derived home/away, family.presence
let zones = [];
let events = [];
let tab = "zones";
let editing = null;      // zone draft being edited (null = list view)
let error = "";
let loadFailed = false;  // the first load failed: zones and history are unknown, not empty
// What this household may CREATE. Optimistic until the hub says otherwise:
// the app cannot read the plan, so it assumes the ceiling and narrows on the
// first zone_limit refusal, which carries the real numbers. MAX_ZONES stays
// the platform ceiling and never moves.
let zoneCap = MAX_ZONES;
// Zones held across EVERY declaring app, which is what the cap is enforced
// against. null until the hub tells us; the local zones.length is only this
// app's share and under-reports whenever a sibling app holds zones too.
let zoneUsed = null;
let upgradeBundle = null;
let zonesDenied = false; // non-adult viewer: zones read is adult-only → history-only mode
let map = null;
let mapCircle = null;
let searchQuery = "";     // address-search box contents, kept across re-renders
let searchResults = [];   // [{ label, lat, lng }] from the last search
let searchBusy = false;
let searchMessage = "";

async function db(sql, params = []) {
  if (!DB) return { rows: [], status: 0 };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  if (res.status === 403) return { rows: [], status: 403 };
  if (!res.ok) throw new Error(`db ${res.status}`);
  const payload = await res.json().catch(() => null);
  if (!payload || typeof payload !== "object") throw new Error(`db ${res.status}`);
  if (payload.error) throw new Error(payload.error);
  return { rows: payload.rows ?? [], status: res.status };
}

async function mutateZone(method, body) {
  const res = await fetch(ZONE_MANAGE, {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const payload = await res.json().catch(() => ({}));
    // Keyed on `error`, never on the status: the hub also returns 507 when the
    // household is out of DB storage, which is a different refusal entirely.
    if (payload.error === "zone_limit") {
      if (Number.isFinite(payload.cap)) {
        zoneCap = payload.cap;
        // The refusal is itself evidence the household is at the cap — even if
        // our count says otherwise, because a sibling app holds the difference.
        zoneUsed = zoneUsed === null ? payload.cap : Math.max(zoneUsed, payload.cap);
      }
      if (payload.bundle) upgradeBundle = payload.bundle;
      const err = new Error("zone_limit");
      err.zoneLimit = true;
      throw err;
    }
    throw new Error(payload.error || `zone ${res.status}`);
  }
  return res.json();
}

// The plan allowance. Only the hub can answer it: the cap is enforced across
// every app declaring geofence_zones, so counting our own table would
// under-report as soon as a second one is installed. Absent (an older hub)
// leaves the optimistic ceiling in place, and the zone_limit refusal still
// corrects it.
function applyLimits(limits) {
  if (!limits || !Number.isFinite(limits.cap)) return;
  zoneCap = limits.cap;
  // Only overwrite the count when the hub actually sent one. Clearing it back
  // to null would drop us to `zones.length`, which counts only THIS app's
  // zones — throwing away a cross-app number we already had for a field the
  // hub simply omitted.
  if (Number.isFinite(limits.used)) zoneUsed = limits.used;
}

async function loadContext() {
  if (!CONTEXT) { members = []; trackers = []; presence = []; return; }
  // Not caught: a roster that could not be read is a failed load (boot raises
  // the banner), not a household with nobody and no trackers in it.
  // Not from the browser's cache, for the count's sake: see refreshLimits.
  const res = await fetch(`${CONTEXT}?keys=family.members,family.geofence_trackers,family.presence,family.geofence_limits`, { cache: "no-store" });
  const ctx = await res.json().catch(() => null);
  if (!res.ok || !ctx || typeof ctx !== "object" || ctx.error) throw new Error("Could not load the member list");
  // A 200 can still name a key the hub failed to read: that is a failed load too.
  if (Array.isArray(ctx.$errors) && ["family.members", "family.geofence_trackers"].some((k) => ctx.$errors.includes(k))) throw new Error("Could not load the member list");
  members = ctx["family.members"] ?? [];
  trackers = ctx["family.geofence_trackers"] ?? [];
  // Empty whenever the household has location switched off or no home zone —
  // the hub decides, this app only renders what it is handed.
  presence = ctx["family.presence"] ?? [];
  applyLimits(ctx["family.geofence_limits"]);
}

/**
 * Move the used count by a zone we just created or deleted.
 *
 * `zoneUsed` gates the counter, the "Add a zone" button and validateZone, so a
 * value fixed at boot latches: delete at the cap and the button stays disabled
 * for the life of the page; create and the count stays low enough to compose an
 * over-cap zone and take a 507. Applied SYNCHRONOUSLY, before the re-render, so
 * the save reads as instant — the authoritative re-read below then costs the
 * user nothing they are waiting on.
 *
 * Skipped while the count is null (an older hub that does not serve the key):
 * there is nothing to move, and the render falls back to `zones.length`.
 */
function bumpUsed(delta) {
  if (zoneUsed !== null) zoneUsed = Math.max(0, zoneUsed + delta);
}

/**
 * Re-read the household's allowance from the hub.
 *
 * The local bump is only ever right about OUR change; the hub is the only thing
 * that counts sibling apps' zones, and it is also where a plan change shows up.
 * Failure is survivable precisely because the bump already moved the number in
 * the right direction.
 */
async function refreshLimits() {
  if (!CONTEXT) return;
  try {
    // Never from the browser's cache: the hub lets a context read be reused for
    // half a minute, and a second change inside that window was answered with
    // the count from before it, written over the bump that had it right.
    const res = await fetch(`${CONTEXT}?keys=family.geofence_limits`, { cache: "no-store" });
    if (!res.ok) return;
    applyLimits((await res.json())["family.geofence_limits"]);
  } catch { /* the local bump stands */ }
}

async function loadZones() {
  const { rows, status } = await db("SELECT * FROM app_safe_zones__zones ORDER BY created_at");
  zonesDenied = status === 403;
  if (zonesDenied && tab === "zones") tab = "history";
  zones = (rows ?? []).map(parseZoneRow).filter(Boolean);
}

let eventsFailed = false;
async function loadEvents() {
  eventsFailed = false;
  try {
    await readEvents();
  } catch (e) {
    eventsFailed = true;
    throw e;
  }
}

async function readEvents() {
  const { rows } = await db("SELECT label, member_name, zone_name, type, occurred_at FROM app_safe_zones__zone_events WHERE classification <> 'duplicate' ORDER BY received_at DESC LIMIT 50");
  events = rows ?? [];
}

function memberName(id) { return members.find((m) => m.id === id)?.name ?? "Unknown"; }
function amAdult() { return !!ME && isAdult(members.find((m) => m.id === ME.id) ?? ME); }

// --- Rendering ---------------------------------------------------------------

function render() {
  const root = document.getElementById("root");
  root.className = "";

  if (loadFailed) {
    root.innerHTML = `
      <div class="topbar"><h1>${glyph("geofence")} Safe Zones</h1></div>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load your safe zones.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    root.querySelector('[data-testid="load-retry"]').addEventListener("click", boot);
    return;
  }

  let html = `
    <div class="topbar">
      <h1>${glyph("geofence")} Safe Zones</h1>
      ${zonesDenied ? "" : `<span class="tiny muted" id="zone-count">${esc(countLabel())}</span>`}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${trackerBannersHtml()}
    ${zonesDenied ? "" : `<div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="${tab === "zones"}" data-tab="zones">Zones</button>
      <button class="tab" role="tab" aria-selected="${tab === "history"}" data-tab="history">History</button>
    </div>`}`;

  html += tab === "zones" && !zonesDenied ? zonesHtml() : historyHtml();
  root.innerHTML = html;
  wireEvents(root);
  if (editing) initMap();
  const autofocus = root.querySelector("[data-autofocus]");
  if (autofocus) autofocus.focus();
}

function countLabel() { return `${zoneUsed ?? zones.length}/${zoneCap} zones`; }

/**
 * After a limits re-read. With the editor open only the counter is repainted:
 * a full render rebuilds the map, and dropped wherever the adult had panned
 * to, for a number in the corner.
 */
function renderCount() {
  if (!editing) { render(); return; }
  const count = document.getElementById("zone-count");
  if (count) count.textContent = countLabel();
}

function trackerBannersHtml() {
  if (!trackers.length) return "";
  const now = Date.now();
  return trackers.map((t) => {
    const line = trackerStatusLine(t, memberName(t.memberId), now);
    const cls = trackerIsStale(t, now) ? (t.permissionState !== "granted_always" ? "bad" : "warn") : "ok";
    const battery = trackerBatteryLabel(t);
    return `<div class="banner ${cls}">${esc(line)}${battery ? ` <span class="tiny">${esc(battery)}</span>` : ""}</div>`;
  }).join("");
}

function zonesHtml() {
  if (editing) return editorHtml();
  if (!zones.length) {
    const install = trackers.length === 0 ? installHtml() : "";
    return `
      <div class="empty card">
        <h2>No safe zones yet</h2>
        <p class="muted">Draw a circle around school, home, or practice and get a push
        when a tracked family member arrives or leaves.</p>
        ${amAdult() ? `<p style="margin-top:12px"><button class="btn" data-action="new" ${(zoneUsed ?? zones.length) >= zoneCap ? "disabled" : ""}>＋ Add a zone</button></p>` : '<p class="tiny muted">An adult can add zones.</p>'}
      </div>` + install;
  }
  const tiles = zones.map((z) => `
    <div class="zone-tile">
      <span class="zone-dot ${z.active ? "" : "off"}"></span>
      <div class="zone-main">
        <div class="zone-name">${esc(z.name)}</div>
        <div class="zone-sub">${Math.round(z.radiusM)} m ·
          ${z.trackedMemberIds.map((id) => esc(memberName(id))).join(", ") || "nobody tracked"}
          ${z.active ? "" : " · paused"}</div>
        ${presenceHtml(z)}
      </div>
      ${amAdult() ? `<button class="btn ghost" data-action="edit" data-id="${esc(z.id)}">Edit</button>` : ""}
    </div>`).join("");
  return `
    <div class="card"><div class="zone-list">${tiles}</div></div>
    ${amAdult() ? `<div class="btn-row"><button class="btn" data-action="new" ${(zoneUsed ?? zones.length) >= zoneCap ? "disabled" : ""}>＋ Add a zone</button></div>` : ""}
    ${trackers.length === 0 ? installHtml() : ""}`;
}

/** Who is home right now, on the home zone's tile only. */
function presenceHtml(zone) {
  const summary = presenceSummary(zone, presence, memberName);
  if (!summary) return "";
  const chip = (label, names) => names.length
    ? `<span class="pchip">${label} ${esc(names.join(", "))}</span>`
    : "";
  return `<div class="zone-presence">
    ${chip("\u{1F3E0}", summary.home)}
    ${chip("\u{1F6B6}", summary.away)}
    ${chip("\u{2753}", summary.unknown)}
  </div>`;
}

function installHtml() {
  return `
    <div class="card">
      <strong>Get Chickadee Locate</strong>
      <p class="tiny muted" style="margin-top:4px">
        Safe-zone alerts come from the free <em>Chickadee Locate</em> companion app on the
        tracked person's phone. Install it from the App Store or Google Play, sign in, and
        pick who it tracks — alerts for everyone else arrive right here through the hub.
      </p>
    </div>`;
}

function editorHtml() {
  const z = editing;
  const memberChecks = members.filter((m) => m.role !== "guest").map((m) => `
    <label class="check"><input type="checkbox" data-track="${esc(m.id)}"
      ${z.tracked_member_ids.includes(m.id) ? "checked" : ""}> ${esc(m.name)}</label>`).join("");
  const audienceMembers = members.filter((m) => m.role !== "guest").map((m) => `
    <label class="check"><input type="checkbox" data-aud="${esc(m.id)}"
      ${Array.isArray(z.alert_audience) && z.alert_audience.includes(m.id) ? "checked" : ""}
      ${z.alert_audience === "adults" ? "disabled" : ""}> ${esc(m.name)}</label>`).join("");
  return `
    <div class="card">
      <div class="field">
        <label for="zname">Zone name</label>
        <input type="text" id="zname" maxlength="60" value="${esc(z.name)}" placeholder="School" ${searchQuery ? "" : "data-autofocus"}>
      </div>
      <div class="field">
        <label for="zsearch">Find an address</label>
        <div class="search-row">
          <input type="text" id="zsearch" maxlength="200" value="${esc(searchQuery)}"
            placeholder="123 Main St, Springfield" autocomplete="off" enterkeyhint="search"
            ${searchQuery ? "data-autofocus" : ""}>
          <button class="btn ghost" data-action="search" ${searchBusy ? "disabled" : ""}>${searchBusy ? "Searching…" : "Search"}</button>
        </div>
        <div id="search-results">${searchResultsHtml()}</div>
      </div>
      <div id="map"></div>
      <p class="tiny muted" style="margin-bottom:10px">Search for an address or tap the map to place the zone.
        <span id="spot-label">${esc(spotLabel(z))}</span></p>
      <div class="field">
        <label for="zradius">Radius — <span id="radius-label">${clampRadius(z.radius_m)}</span> m</label>
        <input type="range" id="zradius" min="${MIN_RADIUS_M}" max="${MAX_RADIUS_M}" step="10" value="${clampRadius(z.radius_m)}">
      </div>
      <div class="field"><label>Track</label><div class="checks">${memberChecks}</div></div>
      <div class="field">
        <label>Alert</label>
        <div class="checks">
          <label class="check"><input type="checkbox" id="zenter" ${z.alert_on_enter ? "checked" : ""}> On arrive</label>
          <label class="check"><input type="checkbox" id="zexit" ${z.alert_on_exit ? "checked" : ""}> On leave</label>
          <label class="check"><input type="checkbox" id="zactive" ${z.active ? "checked" : ""}> Zone active</label>
        </div>
      </div>
      <div class="field">
        <label>Home</label>
        <div class="checks">
          <label class="check"><input type="checkbox" id="zhome" ${z.is_home ? "checked" : ""}> This zone is home</label>
        </div>
        <p class="tiny muted">Marking a zone as home lets the location screens show
        "Home in ~15 min" when someone is on their way. Only one zone can be home.</p>
      </div>
      <div class="field">
        <label>Who gets the alert</label>
        <div class="checks">
          <label class="check"><input type="radio" name="aud" id="aud-adults" ${z.alert_audience === "adults" ? "checked" : ""}> All adults</label>
          <label class="check"><input type="radio" name="aud" id="aud-members" ${z.alert_audience !== "adults" ? "checked" : ""}> Specific members</label>
        </div>
        <div class="checks" id="aud-list" style="margin-top:6px">${audienceMembers}</div>
      </div>
      <div class="btn-row">
        <button class="btn" data-action="save">${z.id ? "Save zone" : "Create zone"}</button>
        <button class="btn ghost" data-action="cancel">Cancel</button>
        ${z.id ? '<button class="btn danger" data-action="delete">Delete</button>' : ""}
      </div>
    </div>`;
}

function spotLabel(z) {
  return z.lat !== "" ? `Center: ${Number(z.lat).toFixed(5)}, ${Number(z.lng).toFixed(5)}` : "No spot picked yet.";
}

function searchResultsHtml() {
  if (searchMessage) return `<p class="tiny muted search-note">${esc(searchMessage)}</p>`;
  if (!searchResults.length) return "";
  const rows = searchResults.map((r, i) => `
    <button type="button" class="result" data-result="${i}">${esc(r.label)}</button>`).join("");
  return `<div class="results">${rows}</div>
    <p class="tiny muted search-note">Addresses from OpenStreetMap.</p>`;
}

function historyHtml() {
  // Non-adults land here directly: zones are adult-managed. The history the
  // hub returns is scoped by the row policy to the viewer's own crossings
  // unless they supervise (an adult at home, the steward in a shared space),
  // so everyone else is told whose activity this is.
  const viewer = ME ? (members.find((m) => m.id === ME.id) ?? ME) : null;
  const noteText = zonesDenied ? ownActivityNote(null, TENANT) : ownActivityNote(viewer, TENANT);
  const note = noteText ? `<p class="tiny muted" style="margin-bottom:8px">${esc(noteText)}</p>` : "";
  // A read that failed is not an empty history, and a viewer with no tabs has
  // no other way to ask again.
  if (eventsFailed) return note + '<div class="error" role="alert">Couldn\'t load zone activity. <button class="btn ghost" data-action="reload-history">Try again</button></div>';
  if (!events.length) return note + '<div class="empty card">No zone activity in the last 30 days.</div>';
  const rows = events.map((e) => `
    <div class="hist-row">
      <span>${esc(e.label || `${e.member_name || "Someone"} ${e.type === "enter" ? "arrived at" : "left"} ${e.zone_name || "a zone"}`)}</span>
      <span class="hist-when">${esc(formatRelativeDate ? formatRelativeDate(e.occurred_at) : e.occurred_at)}</span>
    </div>`).join("");
  return `${note}<div class="card"><div class="hist">${rows}</div></div>`;
}

// --- Map ---------------------------------------------------------------------

function initMap() {
  const el = document.getElementById("map");
  if (!el || typeof L === "undefined") return;
  const z = editing;
  const hasSpot = z.lat !== "" && z.lng !== "";
  // render() replaces the container on every state change, so drop the previous
  // instance's listeners before building a new one.
  if (map) { try { map.remove(); } catch { /* container already gone */ } }
  mapCircle = null;
  // worldCopyJump: panning across the date line moves the view onto the real
  // world, so a tap, and the circle drawn for it, land where the finger is.
  // Without it the circle was drawn a whole world away from the tap.
  map = L.map(el, { zoomControl: true, attributionControl: false, worldCopyJump: true });
  // Tiles come from the hub, not straight from OSM. Their tile usage policy
  // disallows both halves of what this used to send — the deprecated {s}
  // sharding subdomains, and a client with no identifying User-Agent, which a
  // browser cannot supply — and every map in the product was being served
  // their "blocked" image instead of a tile. The hub proxy adds the User-Agent
  // and a shared cache in front of the upstream. Root-relative on purpose: the
  // same URL resolves whether this app is framed under /run/:appId on the hub
  // origin or served from its own {appId}.apps.* origin.
  L.tileLayer("/api/tiles/{z}/{x}/{y}", { maxZoom: 19 }).addTo(map);
  if (hasSpot) map.setView([Number(z.lat), Number(z.lng)], 15);
  else map.setView([39.5, -98.35], 4);
  if (hasSpot) drawCircle();
  map.on("click", (ev) => {
    // Wrapped into -180..180: on a map panned across the date line a tap
    // reports the longitude of the repeated world it landed on (-210 for
    // Japan seen west of America), which no save would then accept.
    const at = ev.latlng.wrap();
    z.lat = String(at.lat);
    z.lng = String(at.lng);
    drawCircle();
    // No re-render (it would rebuild the map), so the line under it is set here.
    const label = document.getElementById("spot-label");
    if (label) label.textContent = spotLabel(z);
  });
}

function drawCircle() {
  if (!map || editing.lat === "") return;
  const center = [Number(editing.lat), Number(editing.lng)];
  const radius = clampRadius(editing.radius_m);
  if (mapCircle) { mapCircle.setLatLng(center); mapCircle.setRadius(radius); }
  else mapCircle = L.circle(center, { radius, color: "#2563eb", fillOpacity: 0.15 }).addTo(map);
}

// --- Actions -----------------------------------------------------------------

function blankZone() {
  return {
    id: "", name: "", lat: "", lng: "", radius_m: "300",
    tracked_member_ids: [], alert_audience: "adults",
    alert_on_enter: true, alert_on_exit: true, active: true, is_home: false,
  };
}

function readEditorInputs(root) {
  const z = editing;
  z.name = root.querySelector("#zname")?.value ?? z.name;
  z.radius_m = root.querySelector("#zradius")?.value ?? z.radius_m;
  z.alert_on_enter = !!root.querySelector("#zenter")?.checked;
  z.alert_on_exit = !!root.querySelector("#zexit")?.checked;
  z.active = !!root.querySelector("#zactive")?.checked;
  z.is_home = !!root.querySelector("#zhome")?.checked;
  z.tracked_member_ids = [...root.querySelectorAll("[data-track]:checked")].map((el) => el.dataset.track);
  if (root.querySelector("#aud-adults")?.checked) z.alert_audience = "adults";
  else z.alert_audience = [...root.querySelectorAll("[data-aud]:checked")].map((el) => el.dataset.aud);
}

function resetSearch() {
  searchQuery = ""; searchResults = []; searchBusy = false; searchMessage = "";
  searchGen++;   // an answer still on its way belongs to the editor that asked
}
let searchGen = 0;

/** Takes the map down with its listeners. Forgetting the instance instead left
 *  each one alive, with its resize listener, for the life of the page. */
function dropMap() {
  if (map) { try { map.remove(); } catch { /* container already gone */ } }
  map = null; mapCircle = null;
}

/** Leaves the editor for the list. */
function closeEditor() {
  editing = null; dropMap(); resetSearch();
}

/**
 * render() for a continuation that lands after an await. The editor is rebuilt
 * from `editing`, and most of its fields reach `editing` only when they are
 * read, so whatever was typed or ticked while the request was out is read
 * first; a bare render() there threw it away.
 */
function renderKeepingEdits() {
  const root = document.getElementById("root");
  if (editing && root.querySelector("#zname")) readEditorInputs(root);
  render();
}

/** Looks the typed address up on demand — never per keystroke, which the
 *  OpenStreetMap geocoder's usage policy forbids. */
async function runAddressSearch(root) {
  if (searchBusy) return;
  readEditorInputs(root);
  searchQuery = root.querySelector("#zsearch")?.value ?? "";
  const url = buildGeocodeUrl(searchQuery);
  if (!url) {
    searchResults = [];
    searchMessage = "Type at least three characters of an address.";
    render();
    return;
  }
  searchBusy = true; searchMessage = ""; searchResults = [];
  const gen = ++searchGen;
  paintSearch(root);
  let results = [];
  let message = "";
  try {
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error(`geocode ${res.status}`);
    results = parseGeocodeResults(await res.json());
    message = results.length ? "" : "No places matched that address.";
  } catch {
    message = "Couldn't look that address up. Try again, or tap the map.";
  }
  // The editor that asked was closed, or another zone opened, meanwhile.
  if (gen !== searchGen || !editing) return;
  searchResults = results; searchMessage = message; searchBusy = false;
  paintSearch(root);
}

/**
 * Redraws the search button and its results where they stand. The rest of the
 * editor is left alone: a full render for these rebuilt the map, moved focus
 * to the search box under whatever the adult was typing, and read back fields
 * it had no reason to touch.
 */
function paintSearch(root) {
  const button = root.querySelector('[data-action="search"]');
  if (button) { button.disabled = searchBusy; button.textContent = searchBusy ? "Searching…" : "Search"; }
  const list = root.querySelector("#search-results");
  if (!list) return;
  list.innerHTML = searchResultsHtml();
  wireResults(root);
}

function wireResults(root) {
  root.querySelectorAll("[data-result]").forEach((btn) => btn.addEventListener("click", () => {
    pickSearchResult(root, Number(btn.dataset.result));
  }));
}

function pickSearchResult(root, index) {
  const hit = searchResults[index];
  if (!hit || !editing) return;
  readEditorInputs(root);
  editing.lat = String(hit.lat);
  editing.lng = String(hit.lng);
  if (!String(editing.name).trim()) editing.name = zoneNameFromResult(hit);
  searchResults = [];
  searchMessage = "";
  dropMap();   // re-created centered on the picked address
  render();
}

// One zone write at a time: a second tap on Create while the first is still
// out sent a second zone.
let writing = false;

/** The re-read after a zone write that already landed. A failure here is not
 *  the write failing, and saying so sent people to create the zone again. */
async function reloadZonesAfterWrite(done = "Saved") {
  try {
    await loadZones();
  } catch {
    error = `${done}, but the list could not refresh. Reload to see it.`;
  }
}

const STILL_WRITING = ["Still finishing the last change.", { description: "Try again in a moment." }];

async function saveZone(root) {
  if (writing) { hubAlert(...STILL_WRITING); return; }
  error = "";
  readEditorInputs(root);
  const z = editing;
  const problems = validateZone(z, zoneUsed ?? zones.length, !!z.id, zoneCap);
  if (Array.isArray(z.alert_audience) && z.alert_audience.length === 0) {
    problems.push("Pick at least one person to alert (or choose All adults).");
  }
  if (problems.length) { await hubAlert(problems[0]); return; }
  writing = true;
  // Said on the button: the write is several round trips, and with nothing on
  // screen a second tap or a walk to another zone looked like the way forward.
  const saveButton = root.querySelector('[data-action="save"]');
  if (saveButton) { saveButton.disabled = true; saveButton.textContent = "Saving…"; }
  try {
    await mutateZone("POST", {
      ...(z.id ? { id: z.id } : {}),
      name: z.name.trim(),
      lat: Number(z.lat),
      lng: Number(z.lng),
      radiusM: clampRadius(z.radius_m),
      trackedMemberIds: z.tracked_member_ids,
      alertAudience: z.alert_audience,
      alertOnEnter: z.alert_on_enter,
      alertOnExit: z.alert_on_exit,
      active: z.active,
      isHome: z.is_home,
    });
  } catch (e) {
    writing = false;
    const elsewhere = editing !== z;   // the adult has moved on to another zone, or to the list
    error = e?.zoneLimit
      ? (zoneCap < MAX_ZONES
        ? `You're using all ${zoneCap} safe zones on your plan. Your existing zones keep working and keep alerting${upgradeBundle ? ` — renew in Settings → Billing for up to ${MAX_ZONES}` : ""}.`
        : `You can have at most ${MAX_ZONES} zones (phone OS limit). Remove one to add another.`)
      : !elsewhere ? "Couldn't save the zone. Try again."
      // A zone that was being created has nothing to open: it has to be added again.
      : z.id ? `Couldn't save "${z.name.trim()}". Open it and try again.` : `Couldn't create "${z.name.trim()}". Add it again.`;
    // Whatever was typed after the tap is read back first, in this editor or another.
    renderKeepingEdits();
    return;
  }
  const created = !z.id;
  if (created) bumpUsed(1);
  // Only the editor that asked is closed. A draft opened since is the adult's
  // current work and stays, with what they have typed into it.
  if (editing === z) { closeEditor(); render(); }
  await reloadZonesAfterWrite();
  writing = false;
  renderKeepingEdits();
  // After the render, never before it: the count on screen is already right
  // for our own change, so the user waits on nothing while the hub confirms
  // it and folds in anything a sibling app did.
  if (created) { await refreshLimits(); renderCount(); }
}

async function deleteZone() {
  const ok = await hubConfirm({
    message: "Delete this zone?",
    description: "Phones tracking it will stop within a few hours. History rows are kept.",
    confirmLabel: "Delete",
    destructive: true,
  });
  if (!ok || !editing) return;
  if (writing) { hubAlert(...STILL_WRITING); return; }
  const z = editing;
  writing = true;
  error = "";
  const deleteButton = document.querySelector('#root [data-action="delete"]');
  if (deleteButton) { deleteButton.disabled = true; deleteButton.textContent = "Deleting…"; }
  try {
    await mutateZone("DELETE", { id: z.id });
  } catch (e) {
    // Already gone (another adult removed it) is the outcome that was asked for.
    if (e?.message !== "zone_not_found") {
      writing = false;
      error = "Couldn't delete the zone.";
      renderKeepingEdits();
      return;
    }
  }
  bumpUsed(-1);
  // Off the list at once, and still off it if the re-read below fails: a
  // deleted zone left listed could be opened and "deleted" again.
  zones = zones.filter((x) => x.id !== z.id);
  if (editing === z) { closeEditor(); render(); }
  await reloadZonesAfterWrite("Deleted");
  writing = false;
  renderKeepingEdits();
  await refreshLimits();
  renderCount();
}

function wireEvents(root) {
  root.querySelectorAll("[data-tab]").forEach((btn) => btn.addEventListener("click", async () => {
    tab = btn.dataset.tab;
    closeEditor();
    error = "";
    // Drawn at once, and again whatever the read does: the editor is gone the
    // moment it is closed, so nothing of it is left on screen to press while
    // the read is out, and a failed read says so in the list's place.
    render();
    if (tab === "history") {
      await loadEvents().catch(() => {});
      // The adult may be back on Zones with an editor open by now.
      renderKeepingEdits();
    }
  }));
  root.querySelectorAll("[data-action]").forEach((btn) => btn.addEventListener("click", async () => {
    const action = btn.dataset.action;
    // A message is about the action that raised it; the next one starts clean.
    if (action === "new" || action === "edit" || action === "cancel") error = "";
    if (action === "new") { editing = blankZone(); resetSearch(); render(); }
    else if (action === "search") { await runAddressSearch(root); }
    else if (action === "edit") {
      resetSearch();
      const z = zones.find((x) => x.id === btn.dataset.id);
      if (!z) return;
      editing = {
        id: z.id, name: z.name, lat: String(z.lat), lng: String(z.lng), radius_m: String(z.radiusM),
        tracked_member_ids: [...z.trackedMemberIds], alert_audience: z.alertAudience,
        alert_on_enter: z.alertOnEnter, alert_on_exit: z.alertOnExit, active: z.active,
        is_home: z.isHome,
      };
      render();
    }
    else if (action === "cancel") { closeEditor(); render(); }
    else if (action === "reload-history") { await loadEvents().catch(() => {}); renderKeepingEdits(); }
    else if (action === "save") { await saveZone(root); }
    else if (action === "delete") { await deleteZone(); }
  }));
  wireResults(root);
  const search = root.querySelector("#zsearch");
  if (search) {
    search.addEventListener("input", () => { searchQuery = search.value; });
    search.addEventListener("keydown", async (ev) => {
      if (ev.key !== "Enter") return;
      ev.preventDefault();   // Enter in the editor must search, not submit
      await runAddressSearch(root);
    });
  }
  const radius = root.querySelector("#zradius");
  if (radius) radius.addEventListener("input", () => {
    editing.radius_m = radius.value;
    const label = root.querySelector("#radius-label");
    if (label) label.textContent = String(clampRadius(radius.value));
    drawCircle();
  });
  // Set in place rather than re-rendered: a render rebuilds the map and drops
  // wherever the adult had panned and zoomed to.
  root.querySelectorAll('input[name="aud"]').forEach((el) => el.addEventListener("change", () => {
    const adults = !!root.querySelector("#aud-adults")?.checked;
    root.querySelectorAll("[data-aud]").forEach((box) => { box.disabled = adults; if (adults) box.checked = false; });
    readEditorInputs(root);
  }));
}

// --- Boot --------------------------------------------------------------------

async function boot() {
  let failed = false;
  try {
    // History is read at boot for everyone, not only for whoever lands on it.
    // The hub answers this one read from rows embedded in the page; left
    // unread, they answered the first History tap instead, however long the
    // page had been open, and a crossing that had just alerted was missing.
    // Each read stands alone: a failed zones read used to end the wait at
    // once, and the page was drawn before members and trackers had arrived,
    // never to be drawn again.
    await Promise.all([
      loadContext(),
      loadZones().catch(() => { failed = true; }),
      loadEvents().catch(() => { failed = true; }),
    ]);
  } catch {
    failed = true;
  }
  loadFailed = failed;
  render();
}

boot();
</script>
</body>
</html>
